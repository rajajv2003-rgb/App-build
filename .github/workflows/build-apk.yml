name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        run: |
          unzip -q StraTradegy-complete-source-enhanced.zip -d /tmp/source
          cp -a /tmp/source/StraTradegy-main/. .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential ccache libltdl-dev

      - name: Install Buildozer
        run: |
          pip install "buildozer==1.5.0" "Cython==0.29.37" setuptools wheel virtualenv

      - name: Build Android APK
        run: |
          ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" tools/build_llama_android.sh
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore
          buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: stratradegy-apk
          path: bin/*.apk
