name: Build APK

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**.md"
      - "tests/**"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo rm -rf /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          unzip -q StraTradegy-complete-source-enhanced.zip -d /tmp/source
          cp -a /tmp/source/StraTradegy-main/. .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade \
            "buildozer==1.5.0" \
            "Cython==0.29.37" \
            setuptools wheel virtualenv

      - name: Restore Android build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}-${{ github.run_id }}
          restore-keys: |
            buildozer-

      - name: Build llama.cpp for Android
        run: |
          chmod +x tools/build_llama_android.sh
          ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" \
            bash tools/build_llama_android.sh

      - name: Install signing key
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Build Android APK
        run: |
          buildozer -v android debug

      - name: Verify APK
        run: |
          ls -lh bin/*.apk
          test -f "$(find bin -name '*.apk' | head -1)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stratradegy-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            .buildozer/**/*.log
            ~/.buildozer/**/*.log
          if-no-files-found: ignore
